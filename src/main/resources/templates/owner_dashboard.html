<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Owner Dashboard</title>
    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Owner Dashboard</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-green-600">Welcome Hotel Owner: <span th:text="${user.name}"></span></h1>
            <a href="/logout" class="bg-red-500 text-white px-4 py-2 rounded font-bold">Logout</a>
        </div>

        <div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            Hotel price must be at least LKR 1000 and cannot contain decimals!
        </div>

        <!-- Add Hotel Form -->
        <div class="bg-green-50 p-4 rounded mb-8 border border-green-200">
            <h2 class="text-lg font-bold mb-2 text-green-800">Add New Hotel (Minimum LKR 1000)</h2>
            <form action="/owner/add-hotel" method="POST" class="grid grid-cols-1 md:grid-cols-4 gap-2">
                <input type="text" name="name" placeholder="Hotel Name" required class="border p-2 rounded">
                <input type="text" name="location" placeholder="Location" required class="border p-2 rounded">
                <input type="number" name="pricePerNight" min="1000" step="1" placeholder="Price / Night (Min 1000 LKR)" required class="border p-2 rounded">
                <button type="submit" class="bg-green-600 text-white font-bold p-2 rounded hover:bg-green-700">Add Hotel</button>
            </form>
        </div>

        <!-- Managed Hotels & Booked Dates -->
        <h2 class="text-xl font-semibold mb-4 text-gray-700">My Hotels & Customer Booking Dates</h2>
        <div th:each="hotel : ${hotels}" class="border p-4 rounded mb-4 bg-white shadow-sm">
            <div class="flex justify-between items-center border-b pb-2 mb-2">
                <div>
                    <h3 class="font-bold text-lg text-green-800" th:text="${hotel.name}"></h3>
                    <p class="text-sm text-gray-500">Location: <span th:text="${hotel.location}"></span> | Price: LKR <span th:text="${hotel.pricePerNight}"></span> / Night</p>
                </div>
                <form action="/owner/delete-hotel" method="POST">
                    <input type="hidden" name="hotelId" th:value="${hotel.id}">
                    <button type="submit" class="bg-red-500 text-white text-xs px-3 py-1 rounded font-bold">Delete Hotel</button>
                </form>
            </div>

            <!-- Booked Dates List -->
            <h4 class="text-sm font-bold text-gray-700 mt-2">Current Booked Date Ranges:</h4>
            <ul class="list-disc pl-5 text-sm text-gray-600">
                <li th:each="b : ${hotelBookings.get(hotel.id)}" th:if="${b.status == 'BOOKED'}">
                    Booking ID: <span class="font-bold" th:text="${b.id}"></span> |
                    Booked From: <span class="text-blue-600 font-bold" th:text="${b.checkInDate}"></span>
                    To: <span class="text-blue-600 font-bold" th:text="${b.checkOutDate}"></span>
                </li>
            </ul>
        </div>
    </div>
    </body>
    </html>
