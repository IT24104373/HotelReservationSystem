<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | LuxeStay Hotel Reservation System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Outfit"', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white relative overflow-x-hidden">

<!-- Ambient Glow Orbs -->
<div class="fixed top-10 right-10 w-96 h-96 bg-indigo-600/15 rounded-full blur-[120px] pointer-events-none -z-10"></div>
<div class="fixed bottom-10 left-10 w-96 h-96 bg-emerald-500/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>

<!-- Back to Home Floating Link -->
<a href="/" class="fixed top-6 left-6 z-20 flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-xs font-semibold text-slate-300 hover:text-white border border-slate-700/60 backdrop-blur-md shadow-lg transition">
    <i class="fa-solid fa-arrow-left text-indigo-400"></i>
    <span>Back to Home</span>
</a>

<div class="w-full max-w-lg my-10">
    <!-- Card Container -->
    <div class="bg-slate-900/85 backdrop-blur-2xl border border-slate-700/70 p-8 sm:p-10 rounded-3xl shadow-2xl relative overflow-hidden">
        
        <!-- Top Glow Accent -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-400 via-indigo-500 to-amber-400"></div>

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-4 shadow-inner">
                <i class="fa-solid fa-user-plus text-2xl text-emerald-400"></i>
            </div>
            <h1 class="text-3xl font-black font-heading tracking-tight text-white">Create Account</h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-1">Join LuxeStay to book stays or manage properties</p>
        </div>

        <!-- Register Form -->
        <form action="/register" method="POST" class="space-y-5">
            <!-- Full Name -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                    <i class="fa-regular fa-user text-indigo-400 mr-1.5"></i> Full Name
                </label>
                <input type="text" name="name" placeholder="John Doe" required
                       class="w-full px-4 py-3 bg-slate-800/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition">
            </div>

            <!-- Email Address -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                    <i class="fa-regular fa-envelope text-indigo-400 mr-1.5"></i> Email Address
                </label>
                <input type="email" name="email" placeholder="name@example.com" required
                       class="w-full px-4 py-3 bg-slate-800/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition">
            </div>

            <!-- Password -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                    <i class="fa-solid fa-lock text-indigo-400 mr-1.5"></i> Password
                </label>
                <div class="relative">
                    <input type="password" id="passwordInput" name="password" placeholder="••••••••" required
                           class="w-full px-4 py-3 bg-slate-800/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition pr-10">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200">
                        <i id="eyeIcon" class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Visual Role Selector -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                    <i class="fa-solid fa-users text-indigo-400 mr-1.5"></i> I want to register as
                </label>
                
                <input type="hidden" name="role" id="roleInput" value="CUSTOMER">

                <div class="grid grid-cols-2 gap-3">
                    <!-- Customer Card Option -->
                    <button type="button" id="roleBtnCustomer" onclick="selectRole('CUSTOMER')"
                            class="p-4 rounded-2xl border-2 text-left transition bg-indigo-600/15 border-indigo-500 text-white shadow-lg shadow-indigo-600/10">
                        <div class="w-8 h-8 rounded-xl bg-indigo-500/20 text-indigo-300 flex items-center justify-center text-sm mb-2">
                            <i class="fa-solid fa-suitcase-rolling"></i>
                        </div>
                        <div class="font-bold text-sm">Guest / Customer</div>
                        <div class="text-[11px] text-slate-400 mt-0.5">Explore & book hotel reservations</div>
                    </button>

                    <!-- Owner Card Option -->
                    <button type="button" id="roleBtnOwner" onclick="selectRole('OWNER')"
                            class="p-4 rounded-2xl border-2 text-left transition bg-slate-800/60 border-slate-700 text-slate-300 hover:border-slate-600 hover:text-white">
                        <div class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-sm mb-2">
                            <i class="fa-solid fa-hotel"></i>
                        </div>
                        <div class="font-bold text-sm">Hotel Owner</div>
                        <div class="text-[11px] text-slate-400 mt-0.5">List & manage hotel properties</div>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-600/30 transition transform active:scale-[0.98] flex items-center justify-center gap-2 mt-2">
                <span>Complete Registration</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Footer link -->
        <div class="mt-6 text-center text-xs text-slate-400">
            Already have an account?
            <a href="/login" class="text-indigo-400 font-bold hover:text-indigo-300 hover:underline transition ml-1">Sign In Here</a>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const input = document.getElementById('passwordInput');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-regular fa-eye-slash text-sm';
        } else {
            input.type = 'password';
            icon.className = 'fa-regular fa-eye text-sm';
        }
    }

    function selectRole(role) {
        document.getElementById('roleInput').value = role;
        const custBtn = document.getElementById('roleBtnCustomer');
        const ownerBtn = document.getElementById('roleBtnOwner');

        if (role === 'CUSTOMER') {
            custBtn.className = 'p-4 rounded-2xl border-2 text-left transition bg-indigo-600/15 border-indigo-500 text-white shadow-lg shadow-indigo-600/10';
            ownerBtn.className = 'p-4 rounded-2xl border-2 text-left transition bg-slate-800/60 border-slate-700 text-slate-300 hover:border-slate-600 hover:text-white';
        } else {
            ownerBtn.className = 'p-4 rounded-2xl border-2 text-left transition bg-amber-500/15 border-amber-500 text-white shadow-lg shadow-amber-600/10';
            custBtn.className = 'p-4 rounded-2xl border-2 text-left transition bg-slate-800/60 border-slate-700 text-slate-300 hover:border-slate-600 hover:text-white';
        }
    }
</script>

</body>
</html>
