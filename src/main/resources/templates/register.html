<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Hotel Reservation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Create Account</h2>
    <form action="/register" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium">Full Name</label>
            <input type="text" name="name" required class="w-full border p-2 rounded mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium">Email Address</label>
            <input type="email" name="email" required class="w-full border p-2 rounded mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium">Password</label>
            <input type="password" name="password" required class="w-full border p-2 rounded mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium">Register As</label>
            <select name="role" class="w-full border p-2 rounded mt-1">
                <option value="CUSTOMER">User (Customer)</option>
                <option value="OWNER">Hotel Owner</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-green-600 text-white p-2 rounded font-bold hover:bg-green-700">Register</button>
    </form>
    <p class="mt-4 text-center text-sm">Account ekak thiyenawada? <a href="/" class="text-blue-600 font-bold">Login Wenna</a></p>
</div>
</body>
</html>
