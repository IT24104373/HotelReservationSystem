<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Hotel Reservation System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Hotel Reservation Login</h2>
    <form action="/login" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium">Email Address</label>
            <input type="email" name="email" required class="w-full border p-2 rounded mt-1 focus:ring-2 focus:ring-blue-400">
        </div>
        <div>
            <label class="block text-sm font-medium">Password</label>
            <input type="password" name="password" required class="w-full border p-2 rounded mt-1 focus:ring-2 focus:ring-blue-400">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700 transition">Login</button>
    </form>
    <!-- Photo portion fixed to English -->
    <p class="mt-4 text-center text-sm text-gray-600">
        Don't have an account? <a href="/register" class="text-blue-600 font-bold hover:underline">Register Here</a>
    </p>
</div>
</body>
</html>
