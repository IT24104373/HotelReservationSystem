spring.application.name=HotelReservationSystem
server.port=8080

# ==============================================================================
# SQL DATABASE CONFIGURATION (MySQL / H2)
# ==============================================================================

# --- OPTION 1: MySQL Database (XAMPP / WAMP / MySQL Workbench) ---
# XAMPP MySQL run karala thiyeddi me tika use karanna (hotel_db auto-create we):
# spring.datasource.url=jdbc:mysql://localhost:3306/hotel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- OPTION 2: H2 Embedded SQL Database (Default - Ready to run immediately) ---
# කිසිදු external software එකක් අවශ්‍ය නොවන embedded SQL database එක:
spring.datasource.url=jdbc:h2:mem:hoteldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# ==============================================================================
# HIBERNATE & JPA CONFIGURATION
# (Auto-creates SQL tables based on Model classes)
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true