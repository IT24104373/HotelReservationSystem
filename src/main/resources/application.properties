spring.application.name=HotelReservationSystem
server.port=8080

# SQL Server configuration for the local SQLEXPRESS01 instance.
spring.datasource.url=jdbc:sqlserver://localhost:1177;databaseName=HotelReservationDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect